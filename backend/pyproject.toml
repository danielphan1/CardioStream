[project]
name = "health-visualizer-backend"
version = "0.1.0"
description = "ETL, database, and (later) API backend for Chris's Health Dashboard"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.*",
    "openpyxl==3.1.*",
    "sqlalchemy==2.0.*",
    "alembic==1.18.*",
    "pydantic==2.13.*",
    "pydantic-settings==2.14.*",
    "fastapi==0.139.*",
    "uvicorn[standard]>=0.50,<0.52",
    "httpx==0.28.*",
    "anthropic==0.117.*",
    "slowapi==0.1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==9.*",
    "ruff==0.15.*",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Anthropic API (needs ANTHROPIC_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
